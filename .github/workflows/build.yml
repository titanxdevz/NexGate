name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run Tests & Build Shadow JARs
        run: ./gradlew test check shadowJar --no-daemon

      - name: Upload Velocity Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexGate-Velocity
          path: nexgate-velocity/build/libs/NexGate-Velocity-*.jar
          retention-days: 14

      - name: Upload Paper Companion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexGate-Paper
          path: nexgate-paper/build/libs/NexGate-Paper-*.jar
          retention-days: 14

      - name: Upload Common Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexGate-Common
          path: nexgate-common/build/libs/NexGate-Common-*.jar
          retention-days: 14
