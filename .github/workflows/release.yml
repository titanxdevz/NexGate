name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG
        id: changelog
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          python3 - << 'EOF'
          import os, re

          tag = os.environ.get("TAG", "")
          version = tag.lstrip("v")
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf'## \[?{re.escape(version)}\]?.*?\n(.*?)(?=\n## |\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else f"Release {tag}"
          except Exception as e:
              notes = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(notes + "\n")
          EOF
          cat release_notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build and Test Release JARs
        run: ./gradlew check shadowJar -Pversion=${{ steps.vars.outputs.version }} --no-daemon

      - name: Prepare Assets & Checksums
        run: |
          mkdir -p release-assets
          cp nexgate-velocity/build/libs/NexGate-Velocity-*.jar release-assets/
          cp nexgate-paper/build/libs/NexGate-Paper-*.jar release-assets/
          cp nexgate-common/build/libs/NexGate-Common-*.jar release-assets/
          cd release-assets
          sha256sum *.jar > checksums.sha256
          cd ..
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c603b55187037881 # v2.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: release_notes.md
          files: |
            release-assets/*.jar
            release-assets/checksums.sha256
          draft: false
          prerelease: false
