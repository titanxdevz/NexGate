name: "Bug Report"
description: Report a bug or unexpected behavior in NexAuth / NexGate
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify you are running the latest version before submitting.

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: The version you are running (check via `/nexgate info`).
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Server Environment
      description: Versions for Velocity proxy, backend Paper/Purpur, and Java runtime.
      placeholder: "e.g. Velocity 3.4.0-SNAPSHOT, Paper 1.21.1, OpenJDK 21"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database Backend
      description: Configured database engine.
      options:
        - "SQLite (nexgate.db)"
        - "MySQL / MariaDB"
        - "PostgreSQL"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Concise summary of the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Connect with client ...
        2. Execute command ...
        3. Observe behavior ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Stack Traces
      description: Paste relevant console logs or stack traces.
      render: shell
