name: "Feature Request"
description: Propose an enhancement or feature for NexAuth / NexGate
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline the proposed capability and its use case.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What operational limitation or problem does this feature solve?
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should the feature behave from an operator, player, or API perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or workarounds evaluated.
    validations:
      required: false
